name: Actualizar descuentos

on:
  schedule:
    # 4 veces por día: 00:17, 06:17, 12:17 y 18:17 hora de Argentina (UTC-3). El minuto 17 evita la hora pico de GitHub.
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: descuentos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Argentina/Buenos_Aires # que "hoy" y las vigencias se calculen con fecha argentina
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bajar descuentos de las webs
        run: node scripts/build.ts
      - name: Publicar (aunque haya fallado una fuente se publica lo que se conserva)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/descuentos.json
          git diff --cached --quiet || (git commit -m "Actualizar descuentos" && git push)
